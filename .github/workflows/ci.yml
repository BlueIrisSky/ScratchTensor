name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check out the pinned ScratchDSL compiler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BlueIrisSky/ScratchDSL
          ref: 62c45299acf126eb6d148ed5f14bcd1322c9e4d6
          path: .scratchdsl-compiler
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build ScratchDSL
        run: cargo +1.98.1 build --release --locked --manifest-path .scratchdsl-compiler/Cargo.toml --bin sbdsl
      - name: Compile documentation and run ScratchDSL integration tests
        run: npm run test:scratchdsl
        env:
          SCRATCHDSL_BIN: ${{ github.workspace }}/.scratchdsl-compiler/target/release/sbdsl
      - name: Prepare and verify release assets
        run: node scripts/release.mjs prepare
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scratchtensor-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload ScratchDSL test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scratchdsl-tests
          path: dist/scratchdsl-tests/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scratchtensor-release
          path: dist/release
      - name: Verify release assets
        run: |
          node scripts/release.mjs verify
          (cd dist/release && sha256sum --check SHA256SUMS.txt)
      - name: Publish verified assets
        run: |
          tag="$GITHUB_REF_NAME"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<'EOF'
          ScratchTensor 扩展，可加载到支持自定义扩展的 Scratch 编辑器，也可配合 ScratchDSL 构建项目。

          - `scratch-tensor-extension.js`：扩展文件。
          - `LICENSE`：MIT 许可证。
          - `SHA256SUMS.txt`：下载文件的 SHA-256 校验值。
          - `release-manifest.json`：版本、源码提交和文件信息。

          发布前已通过单元测试、构建，以及 ScratchDSL 文档示例、运行时和边界测试。
          EOF
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "Release $tag is already published; refusing to replace its assets."
              exit 1
            fi
          else
            gh release create "$tag" --verify-tag --target "$GITHUB_SHA" \
              --draft --title "ScratchTensor $tag" --notes-file "$notes"
          fi
          gh release upload "$tag" dist/release/scratch-tensor-extension.js \
            dist/release/LICENSE dist/release/SHA256SUMS.txt dist/release/release-manifest.json --clobber
          gh release view "$tag" --json assets > "$RUNNER_TEMP/uploaded-assets.json"
          node scripts/release.mjs verify --uploaded "$RUNNER_TEMP/uploaded-assets.json"
          gh release edit "$tag" --draft=false --latest --target "$GITHUB_SHA" \
            --title "ScratchTensor $tag" --notes-file "$notes"
